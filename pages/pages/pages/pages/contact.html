<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header>

    <h1>Contact Us</h1>

    <p>Plan your next adventure with us.</p>

</header>

<nav>

    <a href="../index.html">Home</a>

    <a href="destinations.html">Destinations</a>

    <a href="packages.html">Packages</a>

    <a href="gallery.html">Gallery</a>

    <a href="contact.html">Contact</a>

</nav>

<section>

    <h2>Travel Enquiry</h2>

    <form
        class="contact-form"
        onsubmit="submitForm(event)"
    >

        <input
            type="text"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            placeholder="Your Email"
            required
        >

        <select required>

            <option value="">
                Select Destination
            </option>

            <option>Goa</option>
            <option>Kerala</option>
            <option>Manali</option>
            <option>Jaipur</option>
            <option>Ooty</option>

        </select>

        <textarea
            rows="5"
            placeholder="Your Message"
            required>
        </textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

<footer>

    <p>© 2026 Travel Explorer</p>

</footer>

<script src="../js/script.js"></script>

</body>

</html>
